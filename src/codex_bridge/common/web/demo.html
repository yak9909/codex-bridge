<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codex-bridge 画面部品の見本</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<!-- Every shared part with fixed sample data, to look at (not a test). Open this file directly,
     or http://127.0.0.1:<port>/admin/common/demo.html while the host runs. -->
<header class="topbar">
  <div class="brand">codex-bridge <span class="sub">画面部品の見本</span></div>
  <div class="conn on"><span class="dot"></span><span>接続中（上部の帯）</span></div>
  <button class="pause">全体を一時停止</button>
</header>

<main>
  <section class="banner">一時停止中の帯（見本）</section>
  <section class="banner warn">注意の帯（見本）</section>

  <section class="grid2">
    <div class="card">
      <h2>使用量のバー</h2>
      <p class="small">線なし</p>
      <div id="m-plain" data-label="5 時間枠"></div>
      <p class="small">線 2 本（依頼主のしきい値・貸している人の上限）</p>
      <div id="m-two" data-label="5 時間枠"></div>
      <div id="m-two-week" data-label="週間枠"></div>
      <p class="small">低いほうの線を超えた</p>
      <div id="m-hot" data-label="5 時間枠"></div>
      <p class="small">使用量がまだ届いていない</p>
      <div id="m-none" data-label="週間枠"></div>
    </div>
    <div class="card">
      <h2>状態の色札</h2>
      <div class="row" id="badges"></div>
      <h3>ボタン</h3>
      <div class="row"><button>ふつう</button><button class="ghost">控えめ</button><button class="ok">許可</button>
        <button class="bad">拒否</button><button class="mini">小さい</button><button disabled>押せない</button></div>
      <h3>説明つきの選択肢</h3>
      <div id="choices"></div>
      <p class="small" id="choice-out"></p>
    </div>
  </section>

  <section class="card" id="ap-some" data-title="承認待ち"></section>
  <section class="card" id="ap-none" data-title="事前承認待ち"></section>

  <section class="grid-tasks">
    <div class="card"><h2>タスク</h2><div id="tasks"></div></div>
    <div class="card" id="detail-simple"></div>
  </section>
  <section class="grid-tasks">
    <div class="card"><h2>タスクの詳細（何も選んでいないとき）</h2><div class="card" id="detail-empty"></div></div>
    <div class="card" id="detail-advanced"></div>
  </section>
</main>

<script src="ui.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const BASE = 1794696000;  // 2026-11-15 07:40 (JST)
const HOST = (v) => ({ value: v, label: "依頼主", kind: "host" });
const LENDER = (v) => ({ value: v, label: "貸している人", kind: "lender" });

UI.meter($("m-plain"), { used_percent: 23, resets_at_local: "2026-11-15T12:00+09:00" });
UI.meter($("m-two"), { used_percent: 42, resets_at_local: "2026-11-15T12:00+09:00" }, [HOST(90), LENDER(80)]);
UI.meter($("m-two-week"), { used_percent: 61.4, resets_at_local: "2026-11-19T09:00+09:00" }, [HOST(95), LENDER(80)]);
UI.meter($("m-hot"), { used_percent: 84, resets_at_local: "2026-11-15T12:00+09:00" }, [HOST(90), LENDER(80)]);
UI.meter($("m-none"), null, [HOST(95)]);

$("badges").innerHTML = [...Object.keys(UI.STATE_JA), "something_new"].map(UI.stateBadge).join("");

UI.choiceCards($("choices"), "demo-mode", [
  { value: "off", title: "実行しない", desc: "ファイルの読み書きだけを許します。いちばん安全です。" },
  { value: "allowlist", title: "許可リストだけ自動", desc: "リストに合うコマンドは自動で実行し、それ以外は承認待ちにします。" },
  { value: "ask", title: "毎回確認する", desc: "すべてのコマンドが承認待ちになります。" },
], "allowlist", (v) => { $("choice-out").textContent = `選んだ値: ${v}`; });

const decided = (id, ok) => alert(`${id}: ${ok ? "許可" : "拒否"}`);
UI.approvals($("ap-some"), [
  { id: "a1", tag: "コマンド実行", meta: ["t20261115-074210-3", "12 秒前"], body: "python scripts/build_report.py --out analysis/summary.md" },
  { id: "a2", tag: "削除", meta: ["t20261115-074210-3", "3 秒前"], body: "analysis/old/draft-2.md" },
], decided);
UI.approvals($("ap-none"), [], decided);

const TASKS = [
  { task_id: "t20261115-074210-3", state: "running", lender: "alice", created: BASE + 130,
    prompt: "analysis/report.md を読み、要点を 5 行でまとめて analysis/summary.md に書いてください。" },
  { task_id: "t20261115-073000-2", state: "awaiting_lender", lender: "bob", created: BASE - 600, prompt: "tests を実行して、失敗があれば直してください。" },
  { task_id: "t20261115-071500-1", state: "completed", lender: "alice", created: BASE - 1500, prompt: "README の誤字を直してください。" },
  { task_id: "t20261114-220000-9", state: "suspended_quota", lender: "bob", created: BASE - 34800, prompt: "src/ 全体の型注釈を見直してください。" },
  { task_id: "t20261114-210000-8", state: "rejected_by_lender", lender: "bob", created: BASE - 38400, prompt: "D:/tools/common-lib を最新にしてください。" },
  { task_id: "t20261114-200000-7", state: "failed", lender: null, created: BASE - 42000, prompt: "v0.1 のときのタスク（担当の記録なし）" },
  { task_id: "t20261114-190000-6", state: "cancelled", lender: "alice", created: BASE - 45600, prompt: "途中でやめた依頼" },
];
UI.taskList($("tasks"), TASKS, TASKS[0].task_id, (id) => alert(`選んだタスク: ${id}`));

const PLAN = (a, b, c) => ({ steps: [{ step: "analysis/report.md を読む", status: a },
  { step: "要点を 5 つに絞る", status: b }, { step: "analysis/summary.md に書き、読み直す", status: c }] });
const EVENTS = [
  { ts: BASE + 131, kind: "started", data: {} },
  { ts: BASE + 133, kind: "plan", data: PLAN("inProgress", "pending", "pending") },
  { ts: BASE + 134, kind: "reasoning_summary", data: { text: "まず報告書の章立てを確かめ、数値のある段落を優先して読む。" } },
  { ts: BASE + 135, kind: "tool_started", data: { tool: "read_file", arguments: { path: "analysis/report.md" } } },
  { ts: BASE + 136, kind: "tool_finished", data: { tool: "read_file", arguments: { path: "analysis/report.md" }, duration_ms: 320,
    success: true, result_summary: "412 行" } },
  { ts: BASE + 150, kind: "agent_message", data: { text: "報告書を読みました。要点は売上・費用・在庫・人員・来期の計画の 5 つにまとめます。" } },
  { ts: BASE + 151, kind: "plan", data: PLAN("completed", "inProgress", "pending") },
  { ts: BASE + 152, kind: "token_usage", data: { input: 18234, output: 912 } },
  { ts: BASE + 160, kind: "tool_call", data: { tool: "grep", arguments: "{\"pattern\": \"在庫\"}", status: "completed" } },
  { ts: BASE + 171, kind: "tool_finished", data: { tool: "run_command", arguments: { command: "python scripts/check.py" }, duration_ms: 2140,
    success: false, result_summary: "終了コード 1: FileNotFoundError" } },
  { ts: BASE + 180, kind: "status", data: { text: "使用量の上限に達したため、作業をすぐ止めて報告するよう指示しました" } },
];
const handlers = {
  onFollowup: async (text) => alert(`追加の指示: ${text}`), onCancel: () => alert("中止"), onUndo: () => alert("取り消し"),
};
UI.taskDetail($("detail-simple"), { ...TASKS[0], report: null, thread_id: "019a-demo", changed_files: ["analysis/summary.md"],
  events: EVENTS, event_count: EVENTS.length,
  progress: "要点 3: 在庫は前期より 12% 減りました。主な理由は、秋の" }, { mode: "simple", showLender: true, ...handlers });
UI.taskDetail($("detail-empty"), null);
UI.taskDetail($("detail-advanced"), { ...TASKS[2], finished: BASE - 1500 + 187, thread_id: "019a-demo",
  report: "README の誤字を 3 か所直しました。\n- 「インストル」→「インストール」\n- 「設定ファル」→「設定ファイル」\n- 「実行しまう」→「実行します」",
  changed_files: ["README.md"], events: [...EVENTS.map((e) => ({ ...e, ts: e.ts - 1630 })),
    { ts: BASE - 1500 + 185, kind: "plan", data: PLAN("completed", "completed", "completed") },
    { ts: BASE - 1500 + 187, kind: "turn_completed", data: { status: "completed" } }],
  event_count: 260 }, { mode: "advanced", showLender: true, ...handlers });
</script>
</body>
</html>
