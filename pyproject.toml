[project]
name = "codex-bridge"
version = "0.1.0"
description = "Let a friend's Codex work on local files through MCP"
readme = "README.md"
authors = [
    { name = "yak9909", email = "40179392+yak9909@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "mcp>=2.3.0",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "pyyaml>=6.0.3",
    "truststore>=0.10.5",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
codex-bridge-host = "codex_bridge.host.main:main"
codex-bridge-agent = "codex_bridge.agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
